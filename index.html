<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Picagem Industrial</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f6; --white: #ffffff; }
        html { font-size: 10px; height: 100%; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 2rem; color: var(--primary); display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .box { background: var(--white); border-radius: 4rem; padding: 4rem; width: 100%; max-width: 80rem; box-shadow: 0 2rem 5rem rgba(0,0,0,0.1); margin-bottom: 3rem; box-sizing: border-box; }
        .header-box { display: flex; justify-content: space-between; align-items: center; }
        .header-box img { height: 6rem; }
        .versao { font-size: 1.5rem; font-weight: bold; color: #7f8c8d; }
        .tab-bar { display: flex; width: 100%; max-width: 80rem; margin-bottom: 3rem; background: #ddd; border-radius: 3rem; padding: 0.5rem; }
        .tab-btn { flex: 1; padding: 2rem; border: none; border-radius: 2.5rem; cursor: pointer; font-weight: bold; font-size: 1.8rem; background: transparent; }
        .tab-btn.active { background: var(--white); color: var(--secondary); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
        h3 { margin: 0 0 2rem 0; font-size: 2.5rem; }
        label { display: block; font-weight: bold; color: var(--secondary); font-size: 1.4rem; margin-top: 1.5rem; text-transform: uppercase; }
        input { width: 100%; padding: 2rem; margin: 1rem 0 2rem 0; border: 0.4rem solid #ddd; border-radius: 2rem; font-size: 2.2rem; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 2rem; cursor: pointer; background: var(--secondary); color: white; border: none; border-radius: 2rem; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        .btn-limpar { background: #f8f9fa; color: #e74c3c; border: 0.3rem solid #e74c3c; padding: 1rem 2rem; font-size: 1.4rem; width: auto; }
        .btn-danger { background: #e74c3c; margin-top: 2rem; }
        .btn-export { background: var(--success); margin-bottom: 1.5rem; }
        .tab-content { width: 100%; max-width: 80rem; }
        .hidden { display: none; }
        .acordeao { background: var(--white); border-radius: 2rem; margin-bottom: 2rem; box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.05); overflow: hidden; display: flex; align-items: center; padding-right: 2rem; }
        .acordeao-checkbox { margin-left: 2rem; width: 2.5rem; height: 2.5rem; cursor: pointer; }
        .acordeao-corpo { flex: 1; }
        .cabecalho { padding: 2.5rem; cursor: pointer; font-size: 1.8rem; font-weight: bold; display: flex; justify-content: space-between; border-left: 1rem solid var(--secondary); }
        .conteudo { display: none; padding: 2rem; font-size: 1.4rem; border-top: 0.2rem solid #eee; }
        .badge { background: var(--secondary); color: white; padding: 0.5rem 1.5rem; border-radius: 2rem; }
        #contador-display { font-size: 6rem; text-align: center; margin: 2rem 0; color: var(--secondary); font-weight: bold; }
        .item-row { border-bottom: 1px solid #eee; padding: 0.5rem 0; }
        .historico-acoes { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .historico-acoes button { font-size: 1.4rem; padding: 1.5rem; }
    </style>
</head>
<body>
    <div class="box header-box">
        <img src="https://github.com/user-attachments/assets/7df2b6a5-d732-4175-8f59-9c644d62934b" alt="Logo">
        <span class="versao">v3.1.0</span>
    </div>
    <div class="tab-bar">
        <button class="tab-btn active" onclick="trocarTab('picagem')">PICAGEM</button>
        <button class="tab-btn" onclick="trocarTab('historico')">HISTÓRICO</button>
    </div>
    <div id="tab-picagem" class="tab-content">
        <div id="setup" class="box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Identificação</h3>
                <button class="btn-limpar" onclick="limparIdentificacao()">Limpar</button>
            </div>
            <label>Nome</label>
            <input type="text" id="nomeColaborador">
            <label>Quantidade</label>
            <input type="number" id="qtdTotal">
            <button onclick="iniciarLote()">INICIAR</button>
        </div>
        <div id="areaPicagem" class="box" style="display:none;">
            <h3>Progresso</h3>
            <div id="contador-display"><span id="contador">0</span> / <span id="total">0</span></div>
            <label>Data Matrix</label>
            <input type="text" id="inputScan" autocomplete="off">
        </div>
        <div id="popupEstanquidade" class="box" style="display:none;">
            <h3>Valor Estanquidade</h3>
            <input type="text" id="inputEstanquidade" autocomplete="off">
        </div>
        <div id="popupRef" class="box" style="display:none;">
            <h3>Referência</h3>
            <input type="text" id="inputReferencia" autocomplete="off">
        </div>
        <div id="popupEtiqueta" class="box" style="display:none;">
            <h3>Número Etiqueta</h3>
            <input type="text" id="inputEtiqueta" autocomplete="off">
        </div>
    </div>
    <div id="tab-historico" class="tab-content hidden">
        <div class="historico-acoes">
            <button onclick="exportarSelecionados('xlsx')" class="btn-export">Exportar XLSX (Selecionados)</button>
            <button onclick="exportarSelecionados('pdf')" class="btn-export" style="background: var(--secondary);">Exportar PDF (Selecionados)</button>
            <button onclick="selecionarTodos(true)" class="btn-limpar" style="color: var(--secondary); border-color: var(--secondary);">Selecionar Todos</button>
        </div>
        <div id="containerHistorico"></div>
        <button class="btn-danger" onclick="limparHistorico()">LIMPAR HISTÓRICO</button>
    </div>
    <script>
        let db, total = 0, atual = 0, dadosPicagem = [], scanTemp = "", referenciaTemp = "", scansRealizados = new Set();
        let lotesCache = {};
        const inputScan = document.getElementById('inputScan');
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwO88Rq6RvOuJaS_LLB-LfzXCfyklWmJo0uuJo-o7Od37SHVKU1UJxf0XCpdc9Bl3mm/exec";
        
        const request = indexedDB.open("SistemaPicagemDB", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("lotes", { keyPath: "id", autoIncrement: true }); };
        request.onsuccess = (e) => { db = e.target.result; };

        function iniciarLote() {
            const nome = document.getElementById('nomeColaborador').value;
            const qtd = document.getElementById('qtdTotal').value;
            if(!nome || !qtd) return;
            total = parseInt(qtd);
            document.getElementById('total').innerText = total;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('areaPicagem').style.display = 'block';
            inputScan.focus();
        }

        inputScan.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = inputScan.value.trim();
                if (!val) return;
                if (scansRealizados.has(val)) {
                    alert("Atenção: Data Matrix já picado neste lote!");
                    inputScan.value = '';
                    return;
                }
                scanTemp = val;
                document.getElementById('areaPicagem').style.display = 'none';
                document.getElementById('popupEstanquidade').style.display = 'block';
                document.getElementById('inputEstanquidade').focus();
            }
        });

        document.getElementById('inputEstanquidade').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value) {
                scansRealizados.add(scanTemp);
                dadosPicagem.push({ dataMatrix: scanTemp, estanquidade: e.target.value });
                atual++;
                document.getElementById('contador').innerText = atual;
                e.target.value = '';
                document.getElementById('popupEstanquidade').style.display = 'none';
                if (atual >= total) {
                    document.getElementById('popupRef').style.display = 'block';
                    document.getElementById('inputReferencia').focus();
                } else {
                    document.getElementById('areaPicagem').style.display = 'block';
                    inputScan.value = '';
                    inputScan.focus();
                }
            }
        });

        document.getElementById('inputReferencia').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value) { 
                referenciaTemp = e.target.value; 
                document.getElementById('popupRef').style.display = 'none'; 
                document.getElementById('popupEtiqueta').style.display = 'block'; 
                document.getElementById('inputEtiqueta').focus();
            }
        });

        document.getElementById('inputEtiqueta').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value) {
                const now = new Date();
                const dataFormatada = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                const pacote = { referencia: referenciaTemp, etiqueta: e.target.value, itens: dadosPicagem, data: dataFormatada, colab: document.getElementById('nomeColaborador').value, total: total };
                db.transaction(["lotes"], "readwrite").objectStore("lotes").add(pacote).onsuccess = () => {
                    fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pacote) }).then(() => { alert("Lote enviado!"); location.reload(); });
                };
            }
        });

        function trocarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('hidden', !el.id.includes(tab)));
            if(tab === 'historico') carregarHistorico();
        }

        function carregarHistorico() {
            const container = document.getElementById('containerHistorico'); 
            container.innerHTML = '';
            lotesCache = {};
            db.transaction("lotes").objectStore("lotes").openCursor(null, 'prev').onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const v = cursor.value;
                    lotesCache[v.id] = v;
                    let htmlItens = v.itens.map(i => `<div class="item-row"><b>DM:</b> ${i.dataMatrix} | <b>Est:</b> ${i.estanquidade}</div>`).join('');
                    const div = document.createElement('div'); 
                    div.className = 'acordeao';
                    div.innerHTML = `
                        <input type="checkbox" class="acordeao-checkbox" value="${v.id}" />
                        <div class="acordeao-corpo">
                            <div class="cabecalho" onclick="const c = this.nextElementSibling; c.style.display=(c.style.display=='block'?'none':'block')">ETQ: ${v.etiqueta} <span class="badge">${v.total} Un.</span></div>
                            <div class="conteudo">
                                <p><b>Data:</b> ${v.data} | <b>Colab:</b> ${v.colab} | <b>Ref:</b> ${v.referencia}</p>
                                ${htmlItens}
                            </div>
                        </div>`;
                    container.appendChild(div); 
                    cursor.continue();
                }
            };
        }

        function selecionarTodos(marcar) {
            document.querySelectorAll('.acordeao-checkbox').forEach(cb => cb.checked = marcar);
        }

        function exportarSelecionados(tipo) {
            const checkboxes = document.querySelectorAll('.acordeao-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Por favor, selecione pelo menos um registo do histórico!");
                return;
            }
            let selecionados = [];
            checkboxes.forEach(cb => {
                if(lotesCache[cb.value]) selecionados.push(lotesCache[cb.value]);
            });

            if (tipo === 'xlsx') {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "ID Lote;Data;Colaborador;Referencia;Etiqueta;Total;Data Matrix;Estanquidade\n";
                selecionados.forEach(v => {
                    v.itens.forEach(i => {
                        csvContent += `"${v.id}";"${v.data}";"${v.colab}";"${v.referencia}";"${v.etiqueta}";"${v.total}";"${i.dataMatrix}";"${i.estanquidade}"\n`;
                    });
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "historico_picagem.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else if (tipo === 'pdf') {
                let htmlJanela = `<html><head><title>Relatório de Picagem</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#333;}h1{color:#2c3e50;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px;}th{background-color:#3498db;color:white;}.bloco{margin-bottom:30px;page-break-inside:avoid;}</style></head><body><h1>Relatório de Picagem Industrial</h1>`;
                selecionados.forEach(v => {
                    htmlJanela += `<div class="bloco"><h3>Etiqueta: ${v.etiqueta} (Ref: ${v.referencia})</h3><p><b>Data:</b> ${v.data} | <b>Colaborador:</b> ${v.colab} | <b>Total Unidades:</b> ${v.total}</p><table><tr><th>Data Matrix</th><th>Estanquidade</th></tr>`;
                    v.itens.forEach(i => {
                        htmlJanela += `<tr><td>${i.dataMatrix}</td><td>${i.estanquidade}</td></tr>`;
                    });
                    htmlJanela += `</table></div>`;
                });
                htmlJanela += `</body></html>`;
                const janela = window.open('', '', 'height=700,width=900');
                janela.document.write(htmlJanela);
                janela.document.close();
                janela.focus();
                setTimeout(() => { janela.print(); janela.close(); }, 500);
            }
        }

        function limparIdentificacao() { document.getElementById('nomeColaborador').value = ''; document.getElementById('qtdTotal').value = ''; }
        function limparHistorico() { 
            const pin = prompt("Insira o PIN para confirmar a limpeza:");
            if(pin === "1563") {
                db.transaction(["lotes"], "readwrite").objectStore("lotes").clear().onsuccess = () => location.reload();
            } else if(pin !== null) {
                alert("PIN incorreto!");
            }
        }
    </script>
</body>
</html>
